name: Release

# Publishes the artefacts venpm and manual installers need.
# Trigger by pushing a tag: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the manifest version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(jq -r '.plugins.soundboardHotkeys.version' plugins.json)
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "Tag is $TAG but plugins.json says $MANIFEST - bump the manifest first." >&2
            exit 1
          fi

      - name: Validate the venpm manifest
        run: npx --yes @kamaras/venpm validate plugins.json --strict

      - name: Package the plugin folder
        run: |
          # venpm copies this folder into src/userplugins, so the zip mirrors it exactly.
          cd src
          zip -r ../soundboardHotkeys.zip soundboardHotkeys

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            soundboardHotkeys.zip
            plugins.json
          generate_release_notes: true
          append_body: true
          body: |
            ## Install

            With [venpm](https://venpm.dev), from a Vencord source checkout:

            ```sh
            venpm repo add soundboard-hotkeys https://github.com/${{ github.repository }}/releases/latest/download/plugins.json
            venpm install soundboardHotkeys
            ```

            Or unpack `soundboardHotkeys.zip` into `src/userplugins/` and rebuild.

            Global hotkeys need **Vencord built from source** — a prebuilt install does
            not bundle `native.ts`. Full steps: [INSTALL.md](https://github.com/${{ github.repository }}/blob/main/docs/INSTALL.md)
